<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- "אווירה צ'אט" (2026-10-05): the same app as index.html, opened at /chat with its own
         manifest, so "Add to Home Screen" on the iPhone installs the WhatsApp inbox as a
         separate app that opens straight on the conversations. Vercel serves this file for
         /chat (vercel.json); everything else stays on index.html. -->
    <link rel="icon" type="image/png" href="/brand/chat-favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/chat-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest-chat.json" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black", not "black-translucent" (2026-10-07): with the translucent bar the iPhone
         home-screen app laid the page out one status-bar height too short, leaving an
         unpainted strip under the bottom bar. An opaque black bar avoids that code path. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="אווירה צ'אט" />
    <meta name="robots" content="noindex" />
    <title>אווירה צ'אט</title>
    <!-- The link preview when /chat is pasted in WhatsApp (2026-10-27): the gold "A", AVIRA, CHAT. -->
    <meta name="description" content="שיחות הוואטסאפ של הסטודיו" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AVIRA MEDIA" />
    <meta property="og:url" content="https://new.avira-studio.com/chat" />
    <meta property="og:title" content="אווירה צ'אט | AVIRA MEDIA" />
    <meta property="og:description" content="שיחות הוואטסאפ של הסטודיו" />
    <meta property="og:image" content="https://new.avira-studio.com/brand/og-chat-v2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://new.avira-studio.com/brand/og-chat-v2.jpg" />
    <style>html, body, #root { background: #030712; margin: 0; overscroll-behavior: none; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
