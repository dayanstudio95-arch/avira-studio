# Per-function overrides for Supabase Edge Functions deployment.
# Every function defaults to verify_jwt = true (Supabase platform checks the
# Authorization header before the function code even runs) EXCEPT the ones
# listed here.
#
# google-calendar-oauth-callback is hit directly by Google's OAuth redirect —
# a plain browser GET with no Authorization header at all — so it must have
# JWT verification disabled at the platform level, or every connect attempt
# would 401 before google-calendar-oauth-callback/index.ts ever runs. It
# recovers tenant context itself from the signed `state` query param instead
# (see supabase/functions/_shared/googleCalendarAuth.ts verifyState).
[functions.google-calendar-oauth-callback]
verify_jwt = false

# calendar-sync-webhook is called by a Postgres trigger (via pg_net, see
# supabase/migrations/0017_calendar_sync_trigger.sql), which cannot supply a
# Supabase user JWT. It authenticates itself instead via the x-cron-secret
# header, checked in the function body (same convention as
# reconcile-calendar-sync's cron path).
[functions.calendar-sync-webhook]
verify_jwt = false

# contract-signed-webhook is called by a Postgres trigger (via pg_net, see
# supabase/migrations/0026_notifications_trigger.sql) on leads.signed_at,
# which cannot supply a Supabase user JWT. Authenticates itself via the
# x-cron-secret header (own dedicated CONTRACT_NOTIFICATION_CRON_SECRET),
# same convention as calendar-sync-webhook.
[functions.contract-signed-webhook]
verify_jwt = false

# album-portal and album-print-access back the Wedding Albums module's public,
# no-login pages (/album/:token, /print-access/:token — see App.jsx and
# CLAUDE.md's "Wedding Albums module" section). The couple / print shop never
# has a Supabase session; the raw token from the URL is their only credential,
# hashed and validated against album_orders.portal_token_hash /
# print_access_links.token_hash on every single request inside the function
# body itself. Must have JWT verification disabled at the platform level or
# every request would 401 before that validation ever runs.
[functions.album-portal]
verify_jwt = false

[functions.album-print-access]
verify_jwt = false
